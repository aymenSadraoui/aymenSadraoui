name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  metrics:
    name: Generate GitHub metrics
    runs-on: ubuntu-latest
    steps:
      # 1) Overview card: activity, contributions, repositories, community
      - name: Overview card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aymenSadraoui
          template: classic
          filename: assets/metrics-overview.svg
          output_action: commit
          committer_message: "chore: update overview stats [skip ci]"
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Europe/Paris
          config_display: regular
          repositories_forks: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 2) Languages card
      - name: Languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aymenSadraoui
          template: classic
          filename: assets/metrics-languages.svg
          output_action: commit
          committer_message: "chore: update language stats [skip ci]"
          base: ""
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_skipped: jupyter notebook, html, css

  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Build snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
